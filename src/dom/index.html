<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM Test harness</title>
  </head>
  <body>
    <main>
      <p data-reactive-content="reactiv8"></p>
      <input type="text" value="reactiv8" />
      <textarea value="reactiv8"></textarea>
      <select value="reactiv8">
        <option>Hello</option>
        <option>World</option>
        <option>Hello, World!</option>
      </select>
      <button id="$btn">Update</button>
    </main>

    <script type="module">
      import { reactivate } from './index.js';

      const reactiv8 = reactivate(
        'reactiv8',
        'Hello, World!',
        document.querySelector('main'),
      );

      $btn.addEventListener(
        'click',
        () => (reactiv8.value = prompt('Update') ?? ''),
      );
    </script>
  </body>
</html>
